name: Ecosystem CI

on:
  workflow_dispatch:
    inputs:
      compiler_branch:
        description: 'Alya compiler branch, tag, or commit to test against'
        required: true
        default: 'develop'
      packages:
        description: 'Comma-separated packages to test or ALL'
        required: true
        default: 'ALL'
      run_compiler_tests:
        description: 'Run cargo test on the compiler'
        type: boolean
        required: true
        default: true
      sequential:
        description: 'Run package test suites sequentially'
        type: boolean
        required: false
        default: false
      jobs:
        description: 'Parallel test worker jobs count (e.g. 2 or 4)'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  template-compliance:
    name: Template Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify Package Template Compliance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 -u scripts/check_template_compliance.py --packages "${{ inputs.packages || 'ALL' }}"

  ecosystem-test:
    name: Ecosystem (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux system dependencies (GUI X11 backend)
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Provision Windows ARM64 C toolchain
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $tcDir = "$env:USERPROFILE/.alya/toolchain"
          New-Item -ItemType Directory -Force -Path $tcDir | Out-Null
          $zip = "$env:RUNNER_TEMP/toolchain-arm64.zip"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/latest/download/alya-toolchain-windows-arm64.zip" -OutFile $zip -UseBasicParsing
          } catch {
            Write-Host "Latest toolchain download failed, falling back to v1.0.0"
            Invoke-WebRequest -Uri "https://github.com/alya-lang/toolchain/releases/download/v1.0.0/alya-toolchain-windows-arm64.zip" -OutFile $zip -UseBasicParsing
          }
          Expand-Archive -Path $zip -DestinationPath $tcDir -Force

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run Ecosystem Integration Tests
        shell: bash
        env:
          ALYA_TOOLCHAIN_AUTO_INSTALL: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          COMPILER_BRANCH="${{ inputs.compiler_branch || 'develop' }}"
          PACKAGES="${{ inputs.packages || 'ALL' }}"
          EXTRA_FLAGS=""
          if [ "${{ inputs.run_compiler_tests }}" = "false" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --skip-compiler-tests"
          fi
          if [ "${{ inputs.sequential }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --sequential"
          fi
          if [ -n "${{ inputs.jobs }}" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --jobs ${{ inputs.jobs }}"
          fi

          python3 -u scripts/run_ecosystem_tests.py \
            --compiler-branch "$COMPILER_BRANCH" \
            --packages "$PACKAGES" \
            $EXTRA_FLAGS
